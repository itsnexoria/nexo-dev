<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; width: 100%;
    background: #020204;
    overflow: hidden;
    -webkit-app-region: drag;
    user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
  }

  .glow {
    position: absolute;
    width: 460px; height: 460px;
    background: radial-gradient(circle, #d81f1f22 0%, transparent 70%);
    filter: blur(10px);
    pointer-events: none;
  }

  .logo-wrap {
    position: relative;
    width: 148px; height: 148px;
    margin-bottom: 22px;
    animation: rise 700ms ease-out;
  }
  .logo-wrap img {
    width: 100%; height: 100%;
    display: block;
    filter: drop-shadow(0 0 22px #e5342a3d);
  }

  .ring {
    position: absolute;
    inset: -14px;
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: #e5342a;
    border-right-color: #e5342a55;
    animation: spin 1.1s linear infinite;
  }

  .wordmark {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    animation: rise 700ms ease-out 80ms both;
  }
  .wordmark .nexo {
    background: linear-gradient(180deg, #ffffff, #9aa0a8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .wordmark .dev { color: #e5342a; margin-left: 4px; }

  .status {
    font-size: 11.5px;
    color: #6b6b7d;
    letter-spacing: 0.03em;
    animation: rise 700ms ease-out 160ms both;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="logo-wrap">
    <div class="ring"></div>
    <img src="icons/logo-256.png" alt="Nexo Dev" />
  </div>
  <div class="wordmark"><span class="nexo">NEXO</span><span class="dev">DEV</span></div>
  <div class="status" id="status">Starting up…</div>
</body>
</html>
