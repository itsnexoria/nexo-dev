name: Release
on:
  push:
    tags: ['v*']
jobs:
  release:
    strategy:
      matrix:
        include:
          - { os: windows-latest, script: release }
          - { os: ubuntu-latest, script: 'release:linux' }
          - { os: macos-latest, script: 'release:mac' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      # Code signing is optional: set CSC_LINK / CSC_KEY_PASSWORD (and APPLE_* for notarization) as repo secrets.
      - run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
